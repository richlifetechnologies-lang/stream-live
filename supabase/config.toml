# Supabase project config for local development (supabase CLI).
# Project id is a local label; set the real one when you link a hosted project.
project_id = "stream-studio-login"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:54321"

# Edge Functions run on the Supabase Edge Runtime (Deno). Set their secrets in
# the dashboard for production, or in supabase/.env.local for `supabase start`.
# verify_jwt = false because each function validates the user JWT itself and
# returns a clean reason code the desktop app can show.
[functions.start-session]
verify_jwt = false

[functions.lease]
verify_jwt = false

[functions.proxy-voice]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

# Serves the admin panel HTML. Public shell — access is gated by the admin's own
# login plus the is_admin RLS policies, not by the function JWT.
[functions.admin]
verify_jwt = false

# The buyer's page is open to someone who has not signed in, and they pay against
# an email address rather than a session. Orders are guarded by the email existing,
# a per-address ceiling, and Paystack being asked directly before any credit.
[functions.paystack-checkout]
verify_jwt = false

# Paystack's own call-back. It carries a signature header checked with the secret
# key and is re-verified against Paystack's API, never a JWT.
[functions.paystack-webhook]
verify_jwt = false
