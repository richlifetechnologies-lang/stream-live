<!--
  Stream Live — password recovery email (same styling as the sign-up one).
  Paste into: Authentication -> Sign In / Up -> Email templates -> "Recovery password" -> HTML body.
-->
<html>
  <body style="margin:0;padding:0;background:#06090f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#06090f;">
      <tr>
        <td align="center" style="padding:34px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#0b1120;border:1px solid #16233a;border-radius:16px;">
            <tr>
              <td style="padding:30px 32px 0 32px;">
                <div style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:bold;letter-spacing:5px;color:#0cf2ff;">STREAM&nbsp;LIVE</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;">
                <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:29px;font-weight:bold;color:#eaf7fb;">Reset your password</h1>
                <p style="margin:14px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:23px;color:#9fb4c4;">
                  Someone asked to reset the password on this Stream Live account. Choose a new one and you
                  will be signed in again straight away.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:26px 32px 8px 32px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#0cf2ff;color:#04101a;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;text-decoration:none;padding:14px 30px;border-radius:10px;">
                  Choose a new password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 32px 30px 32px;">
                <div style="border-top:1px solid #16233a;padding-top:18px;">
                  <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#64808f;">
                    If this wasn't you, nothing breaks by ignoring the email &mdash; your current password keeps working.
                  </p>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
